# Compiling PX4 takes ~15 min, which is far too slow to repeat on every test
# run. This workflow builds the image only when the Dockerfile changes and
# publishes it to GHCR; the test workflow just pulls the result.
name: Build SITL image

on:
  push:
    branches: [main]
    paths: ['sitl/Dockerfile', '.github/workflows/sitl-image.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./sitl
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/px4-sih:v1.14.3
          cache-from: type=gha
          cache-to: type=gha,mode=max
